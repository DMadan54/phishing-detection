name: CI

on:
  push:
  pull_request:

# Least privilege: the job can read the code and nothing else. A compromised
# dependency or action running here can't push, tag or change releases.
permissions:
  contents: read

jobs:
  engine:
    name: Engine (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to
      # point at different code, a commit can't. The comment says which
      # release each SHA is; update both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      # Python 3.12 comes from .python-version. --locked fails the build if
      # uv.lock is out of date with pyproject.toml instead of silently
      # resolving new versions.
      - name: Install
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy engine

      - name: Pytest
        run: uv run pytest
