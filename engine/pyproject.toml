[project]
name = "phishlens"
version = "0.1.0"
description = "Explainable phishing detection for emails and URLs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phishlens"]
