[project]
name = "phishlens"
version = "0.1.0"
description = "Explainable phishing detection for emails and URLs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authres>=1.2",
    "dkimpy>=1.1.6",
    "dnspython>=2.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "idna>=3.7",
    "oletools>=0.60.2",
    "publicsuffixlist>=1.0",
    "puremagic>=2.0",
    "pydantic>=2.9",
    "pyspf>=2.0.14",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phishlens"]

# The shared lists live outside the package so the extension can use them
# too; a built wheel carries copies.
[tool.hatch.build.targets.wheel.force-include]
"../shared/brands.json" = "phishlens/data/brands.json"
"../shared/shorteners.json" = "phishlens/data/shorteners.json"
